name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style first: a formatting failure should not wait for the whole suite.
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', coverage: none }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/pint --test

  # Unit and feature suites on SQLite in memory, in parallel, with coverage. No Node: tests call
  # withoutVite(). The browser suite has its own job below, with Playwright.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sqlite3, pdo_sqlite, gd
          coverage: pcov
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pest --testsuite=Unit,Feature --parallel --coverage --min=80 --compact
      - run: ./vendor/bin/pest --type-coverage --min=100 --compact

  # The same suite against the database production runs. Catches what SQLite forgives.
  tests-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: invoicemini_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pest --testsuite=Unit,Feature --parallel --compact
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: invoicemini_test
          DB_USERNAME: root
          DB_PASSWORD: root

  # Browser tests: a real Chromium through Playwright against the built assets.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, sqlite3, pdo_sqlite, gd
          coverage: none
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pest tests/Browser --ci --trace --compact
      - name: Upload screenshots and traces of failed tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests
          path: |
            tests/Browser/Screenshots
            tests/Browser/Traces
